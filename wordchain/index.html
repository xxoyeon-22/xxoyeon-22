<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끝말잇기 온라인 대결</title>
<meta name="description" content="친구와 각자 기기에서 겨루는 끝말잇기. 방 코드로 바로 입장!">
<meta property="og:type" content="website">
<meta property="og:title" content="🔤 끝말잇기 온라인 대결">
<meta property="og:description" content="방 코드로 친구와 바로 한 판!">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root { --bg:#fbf6ea; --card:#fffdf7; --ink:#3b3226; --p1:#e0674f; --p2:#3f8f8b; --mute:#9a8f7e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
         display:flex; justify-content:center; padding:16px; }
  main { width:100%; max-width:520px; }
  h1 { text-align:center; margin:8px 0 16px; }
  .card { background:var(--card); border-radius:16px; padding:16px; box-shadow:0 2px 10px #0001; margin-bottom:12px; }
  .hidden { display:none !important; }
  .players { display:flex; gap:10px; }
  .player { flex:1; text-align:center; padding:10px; border-radius:12px; border:3px solid transparent; background:#0000000a; }
  .player.active { border-color:currentColor; background:#fff; }
  .player .nm { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p1 { color:var(--p1); } .p2 { color:var(--p2); }
  .score { font-size:1.6rem; font-weight:800; }
  .timer { height:8px; background:#0000001a; border-radius:4px; overflow:hidden; margin-top:12px; }
  .timer > div { height:100%; width:100%; background:var(--ink); }
  .current { text-align:center; font-size:2.4rem; font-weight:800; margin:10px 0 4px; letter-spacing:.1em; }
  .hint { text-align:center; color:var(--mute); font-size:.9rem; min-height:1.3em; }
  .hint.err { color:#c0392b; font-weight:700; }
  form, .line { display:flex; gap:8px; margin-top:10px; }
  input.t { flex:1; min-width:0; font-size:1.2rem; padding:12px; border-radius:10px; border:2px solid #d9cfb9; background:#fff; }
  button { font-size:1rem; padding:12px 18px; border:none; border-radius:10px; background:var(--ink); color:#fff; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:#0000001a; color:var(--ink); }
  .words { display:flex; flex-wrap:wrap; gap:6px; max-height:180px; overflow:auto; }
  .chip { padding:4px 10px; border-radius:999px; color:#fff; font-size:.9rem; }
  .chip.p1 { background:var(--p1); } .chip.p2 { background:var(--p2); }
  .row { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .row label { font-size:.9rem; color:var(--mute); }
  .row select { padding:6px; border-radius:8px; border:1px solid #d9cfb9; }
  .code { text-align:center; font-size:2.6rem; font-weight:800; letter-spacing:.2em; margin:8px 0; }
  .sep { text-align:center; color:var(--mute); margin:14px 0; }
  #overlay { position:fixed; inset:0; background:#000a; display:none; align-items:center; justify-content:center; padding:16px; }
  #overlay.show { display:flex; }
  #overlay .box { background:var(--card); border-radius:20px; padding:28px; text-align:center; max-width:340px; }
  #overlay h2 { margin:0 0 8px; font-size:1.8rem; }
  .clap { font-size:4rem; display:inline-block; animation:clap .5s ease-in-out infinite alternate; }
  @keyframes clap { from { transform:scale(1) rotate(-8deg); } to { transform:scale(1.25) rotate(8deg); } }
  #photo { display:block; width:200px; max-width:70%; border-radius:16px; margin:0 auto 6px; box-shadow:0 4px 14px #0003; }
  .cheer { font-size:1.9rem; font-weight:800; line-height:1.3; margin:8px 0 14px; color:var(--p1); }
</style>
</head>
<body>
<main>
  <h1>🔤 끝말잇기 온라인 대결</h1>

  <!-- 로비 -->
  <div id="lobby" class="card">
    <input class="t" id="myname" style="width:100%" placeholder="내 이름" maxlength="8">
    <div class="line"><button id="create" style="flex:1">방 만들기</button></div>
    <div class="sep">또는 친구가 알려준 코드로 입장</div>
    <div class="line">
      <input class="t" id="joincode" placeholder="방 코드 4자리" maxlength="4" style="text-transform:uppercase">
      <button id="join">입장</button>
    </div>
    <div class="hint" id="lobbyMsg" style="margin-top:12px"></div>
  </div>

  <!-- 대기실 -->
  <div id="waiting" class="card hidden">
    <div class="hint">친구에게 이 코드를 알려주세요</div>
    <div class="code" id="roomCode"></div>
    <div class="hint">친구가 입장하면 자동으로 시작돼요…</div>
  </div>

  <!-- 게임 -->
  <div id="game" class="hidden">
    <div class="card">
      <div class="players">
        <div class="player p1" id="pl0"><div class="nm" id="name0"></div><div class="score" id="score0">0</div></div>
        <div class="player p2" id="pl1"><div class="nm" id="name1"></div><div class="score" id="score1">0</div></div>
      </div>
      <div class="timer"><div id="bar"></div></div>
      <div class="current" id="current">시작!</div>
      <div class="hint" id="hint"></div>
      <form id="form" autocomplete="off">
        <input class="t" id="word" placeholder="단어 입력">
        <button id="submit">제출</button>
      </form>
    </div>
    <div class="card"><div class="words" id="words"></div></div>
    <div class="row">
      <label id="limitWrap">제한시간
        <select id="limit"><option>10</option><option selected>15</option><option>20</option><option>30</option><option value="0">없음</option></select>초
      </label>
      <button class="ghost" id="giveup">기권</button>
    </div>
  </div>
</main>

<div id="overlay"><div class="box">
  <img id="photo" alt="" class="hidden">
  <div class="clap" id="clap">👏👏👏</div>
  <div class="cheer" id="cheer"></div>
  <h2 id="winTitle"></h2><p id="winMsg"></p>
  <button id="again">한 판 더!</button>
</div></div>

<script>
const $ = id => document.getElementById(id);
const DUEUM = {'녀':'여','뇨':'요','뉴':'유','니':'이','랴':'야','려':'여','례':'예','료':'요','류':'유','리':'이',
               '라':'나','래':'내','로':'노','뢰':'뇌','루':'누','르':'느','락':'낙','란':'난','람':'남','랑':'낭','령':'영','록':'녹','론':'논','롱':'농','릉':'능','림':'임','립':'입','력':'역','련':'연','렬':'열','렴':'염','렵':'엽','륙':'육','륜':'윤','률':'율','륭':'융','륵':'늑','름':'늠','릇':'늣','릎':'늪'};
const HANGUL = /^[가-힣]{2,}$/;
const PREFIX = 'wordchain-kr-';

let peer, conn, isHost = false, me = 0;
let S = null;              // 공유 게임 상태 (호스트가 관리, 게스트는 수신)
let deadline = 0, limitMs = 0, tick = null;
let names = ['', ''];

function allowed(ch) {
  const s = new Set([ch]);
  if (DUEUM[ch]) s.add(DUEUM[ch]);
  for (const [k, v] of Object.entries(DUEUM)) if (v === ch) s.add(k);
  return s;
}
function hint(msg, err) { $('hint').textContent = msg; $('hint').className = 'hint' + (err ? ' err' : ''); }
function show(id) { for (const x of ['lobby', 'waiting', 'game']) $(x).classList.toggle('hidden', x !== id); }
function myName() { return $('myname').value.trim() || '플레이어'; }

/* ---------- 연결 ---------- */
function makeCode() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 4 }, () => c[Math.floor(Math.random() * c.length)]).join('');
}

$('create').onclick = () => {
  isHost = true; me = 0; names[0] = myName();
  const code = makeCode();
  $('lobbyMsg').textContent = '방 만드는 중…';
  peer = new Peer(PREFIX + code);
  peer.on('error', e => {
    if (e.type === 'unavailable-id') return $('create').click();      // 코드 중복 → 재시도
    $('lobbyMsg').textContent = '연결 오류: ' + e.type;
  });
  peer.on('open', () => { $('roomCode').textContent = code; show('waiting'); });
  peer.on('connection', c => {
    if (conn) return c.close();                                        // 2명만
    conn = c; bind(c);
  });
};

$('join').onclick = () => {
  const code = $('joincode').value.trim().toUpperCase();
  if (code.length !== 4) return ($('lobbyMsg').textContent = '코드 4자리를 입력하세요');
  isHost = false; me = 1; names[1] = myName();
  $('lobbyMsg').textContent = '입장 중…';
  peer = new Peer();
  peer.on('error', e => $('lobbyMsg').textContent = e.type === 'peer-unavailable' ? '해당 방을 찾을 수 없어요' : '연결 오류: ' + e.type);
  peer.on('open', () => {
    conn = peer.connect(PREFIX + code, { reliable: true });
    bind(conn);
  });
};

function bind(c) {
  c.on('open', () => {
    if (isHost) return;                       // 호스트는 게스트의 hello를 기다림
    send({ t: 'hello', name: names[1] });
  });
  c.on('data', onMsg);
  c.on('close', () => {
    if (!S || S.over) return;
    clearInterval(tick);
    hint('상대와 연결이 끊겼어요', true);
    $('submit').disabled = true;
    showEnd('상대가 나갔어요', '연결이 끊겨 게임이 종료됐어요', false);
  });
}
const send = m => conn && conn.open && conn.send(m);

/* ---------- 메시지 처리 ---------- */
function onMsg(m) {
  if (isHost) {
    if (m.t === 'hello') { names[1] = String(m.name || '플레이어').slice(0, 8); startGame(true); }
    else if (m.t === 'word') { const err = submit(1, m.w); if (err) send({ t: 'err', msg: err }); }
    else if (m.t === 'giveup') giveUp(1);
    else if (m.t === 'again') startGame(false);
  } else {
    if (m.t === 'state') apply(m.s);
    else if (m.t === 'err') hint(m.msg, true);
  }
}

/* ---------- 호스트: 게임 로직 ---------- */
function startGame(first) {
  if (first) S = { scores: [0, 0] };
  const limit = +$('limit').value;
  S = { ...S, names: [...names], words: [], turn: 0, over: false, limit, msg: '', winner: null,
        left: limit * 1000 };
  armTimer(); publish();
}
function publish() {
  S.left = limitMs ? Math.max(0, deadline - Date.now()) : 0;
  send({ t: 'state', s: S });
  apply(S);
}
function armTimer() {
  limitMs = S.limit * 1000;
  deadline = Date.now() + limitMs;
}
function submit(p, w) {
  if (!S || S.over) return '';
  if (S.turn !== p) return '상대 차례예요';
  w = String(w).trim();
  if (!HANGUL.test(w)) return '2글자 이상의 한글 단어만 가능해요';
  const last = S.words.length ? S.words[S.words.length - 1].w.slice(-1) : null;
  if (last && !allowed(last).has(w[0])) return `'${last}'(으)로 시작해야 해요`;
  if (S.words.some(x => x.w === w)) return finish(1 - p, `${names[p]}: '${w}'은(는) 이미 나온 단어예요!`), '';
  S.words.push({ w, p });
  S.turn = 1 - p; armTimer(); publish();
  return '';
}
function giveUp(p) { if (S && !S.over) finish(1 - p, `${names[p]} 기권!`); }
function finish(winner, msg) {
  S.over = true; S.winner = winner; S.msg = msg; S.scores[winner]++;
  publish();
}

/* ---------- 공통: 화면 반영 ---------- */
function apply(s) {
  S = s; names = s.names;
  show('game');
  limitMs = s.limit * 1000;
  deadline = Date.now() + s.left;
  $('limitWrap').classList.toggle('hidden', !isHost);
  $('name0').textContent = names[0] + (me === 0 ? ' (나)' : '');
  $('name1').textContent = names[1] + (me === 1 ? ' (나)' : '');
  $('score0').textContent = s.scores[0]; $('score1').textContent = s.scores[1];
  $('pl0').classList.toggle('active', !s.over && s.turn === 0);
  $('pl1').classList.toggle('active', !s.over && s.turn === 1);

  $('words').innerHTML = '';
  for (const x of s.words) {
    const c = document.createElement('span');
    c.className = 'chip p' + (x.p + 1); c.textContent = x.w;
    $('words').appendChild(c);
  }
  $('words').scrollTop = 1e6;

  const last = s.words.length ? s.words[s.words.length - 1].w.slice(-1) : null;
  $('current').textContent = last || '시작!';
  const mine = !s.over && s.turn === me;
  $('word').disabled = !mine; $('submit').disabled = !mine;
  if (mine) $('word').focus();
  hint(s.over ? '' : mine ? `내 차례!${last && DUEUM[last] ? ` (${DUEUM[last]}도 가능)` : ''}` : `${names[s.turn]} 차례…`);

  clearInterval(tick);
  if (s.over) { $('bar').style.width = '0%'; showEnd(`🎉 ${names[s.winner]} 승리!`, s.msg, true); }
  else {
    $('overlay').classList.remove('show');
    tick = setInterval(() => {
      if (!limitMs) return $('bar').style.width = '100%';
      const r = deadline - Date.now();
      $('bar').style.width = Math.max(0, r / limitMs * 100) + '%';
      if (r <= 0 && isHost) { clearInterval(tick); finish(1 - S.turn, `${names[S.turn]} 시간 초과!`); }
    }, 100);
  }
}
function showEnd(title, msg, canRestart) {
  const won = !!(S && S.over && S.winner === me && canRestart);
  $('clap').classList.toggle('hidden', !won);
  $('cheer').classList.toggle('hidden', !won);
  const ph = $('photo');
  if (won) {
    ph.onload = () => ph.classList.remove('hidden');
    ph.src = 'winner.jpg';
  } else { ph.classList.add('hidden'); ph.removeAttribute('src'); }
  $('cheer').textContent = '승리를 진심으로 축하합니다!';
  $('winTitle').textContent = title; $('winMsg').textContent = msg;
  $('again').classList.toggle('hidden', !canRestart);
  $('overlay').classList.add('show');
}

/* ---------- 입력 ---------- */
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const w = $('word').value.trim();
  if (!w) return;
  $('word').value = '';
  if (isHost) { const err = submit(0, w); if (err) hint(err, true); }
  else send({ t: 'word', w });
});
$('giveup').onclick = () => isHost ? giveUp(0) : send({ t: 'giveup' });
$('again').onclick = () => isHost ? startGame(false) : send({ t: 'again' });
</script>
</body>
</html>
