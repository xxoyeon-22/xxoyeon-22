<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐치마인드 온라인</title>
<meta name="description" content="친구들과 각자 기기에서 그리고 맞히는 캐치마인드. 방 코드로 바로 입장!">
<meta property="og:type" content="website">
<meta property="og:title" content="🎨 캐치마인드 온라인">
<meta property="og:description" content="방 코드로 친구들과 바로 한 판!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  /* 칠판 위에 종이를 붙여 놓고 그리는 교실 콘셉트 */
  :root {
    --board:#20403a; --board-deep:#152a26; --panel:#ffffff12; --panel-line:#ffffff26;
    --chalk:#f5f1e6; --chalk-dim:#f5f1e6a6; --paper:#fffdf6; --ink:#1d2b27;
    --yellow:#ffd166; --yellow-edge:#d49b2c; --pink:#ff8fab; --blue:#6ec5ff; --mint:#7ee8c1; --orange:#ffa45b;
    --wood:#b98555; --wood-edge:#8d5f37; --bad:#ff7a7a; --good:#7ee8c1;
    --display:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  * { box-sizing:border-box; }
  html { background:var(--board-deep); }
  body {
    margin:0; min-height:100vh; color:var(--chalk); font-family:var(--body); font-size:16px;
    background:
      radial-gradient(1200px 500px at 50% -10%, #ffffff14, transparent 60%),
      radial-gradient(circle at 20% 90%, #ffffff0a, transparent 40%),
      var(--board);
    display:flex; justify-content:center; padding:20px 16px 40px;
  }
  main { width:100%; max-width:560px; }
  .hidden { display:none !important; }

  .logo { font-family:var(--display); font-size:2.6rem; text-align:center; margin:6px 0 4px; letter-spacing:.04em; line-height:1.1; }
  .logo span:nth-child(1){color:var(--pink)} .logo span:nth-child(2){color:var(--yellow)} .logo span:nth-child(3){color:var(--mint)}
  .logo span:nth-child(4){color:var(--blue)} .logo span:nth-child(5){color:var(--orange)} .logo span:nth-child(6){color:var(--pink)}
  .sub { text-align:center; color:var(--chalk-dim); margin:0 0 22px; }

  .panel { background:var(--panel); border:1.5px dashed var(--panel-line); border-radius:20px; padding:16px; margin-bottom:14px; }
  .lead { font-family:var(--display); font-size:1.15rem; text-align:center; margin:0 0 10px; }

  input.t {
    width:100%; font:inherit; font-size:1.1rem; padding:12px 14px; color:var(--ink);
    background:var(--paper); border:none; border-radius:14px; outline:3px solid transparent; transition:outline-color .15s;
  }
  input.t:focus { outline-color:var(--yellow); }
  input.t:disabled { opacity:.5; }
  .line { display:flex; gap:10px; margin-top:12px; }
  .line input.t { flex:1; min-width:0; }

  button {
    font-family:var(--display); font-size:1.1rem; padding:11px 20px; color:var(--ink); cursor:pointer;
    background:var(--yellow); border:none; border-bottom:4px solid var(--yellow-edge); border-radius:14px;
    transition:transform .08s, border-bottom-width .08s;
  }
  button:active:not(:disabled) { transform:translateY(3px); border-bottom-width:1px; }
  button:disabled { opacity:.4; cursor:default; }
  button.soft { background:var(--panel); color:var(--chalk); border:1.5px solid var(--panel-line); border-bottom-width:1.5px; }
  button.big { width:100%; font-size:1.3rem; padding:14px; }
  button:focus-visible, .sw:focus-visible { outline:3px solid var(--chalk); outline-offset:2px; }

  .sep { text-align:center; color:var(--chalk-dim); margin:18px 0 4px; font-size:.95rem; }
  .msg { text-align:center; min-height:1.4em; color:var(--chalk-dim); margin-top:12px; font-size:.95rem; }
  .msg.err { color:var(--bad); }

  /* 방 코드 */
  .code { display:flex; justify-content:center; gap:8px; margin:10px 0 16px; }
  .code b { font-family:var(--display); font-weight:400; font-size:2.3rem; width:52px; height:64px; display:grid; place-items:center;
            color:var(--ink); background:var(--paper); border-radius:12px; box-shadow:0 4px 0 #0004; }
  .code b:nth-child(odd) { transform:rotate(-3deg); } .code b:nth-child(even) { transform:rotate(3deg) translateY(2px); }

  /* 이름표 */
  .tags { display:flex; flex-wrap:wrap; gap:8px; }
  .tag {
    flex:1 1 92px; min-width:0; text-align:center; padding:7px 8px 6px; border-radius:12px; color:var(--ink);
    background:var(--c); box-shadow:0 3px 0 #0003; transition:transform .15s;
  }
  .tag.drawer { transform:translateY(-4px) rotate(-2deg); box-shadow:0 8px 0 #0003; outline:3px solid var(--chalk); }
  .tag.gone { opacity:.3; filter:grayscale(1); }
  .tag .nm { font-family:var(--display); font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag .sc { font-family:var(--display); font-size:1.35rem; line-height:1.1; }
  .tag .sc small { font-size:.7rem; opacity:.7; margin-left:1px; }

  /* 방 설정 */
  #settings { margin-top:16px; display:flex; flex-direction:column; gap:12px; }
  .set-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .set-row > span { font-family:var(--display); width:100%; font-size:.95rem; color:var(--chalk-dim); }
  .chip { font-size:.95rem; padding:6px 12px; background:var(--panel); color:var(--chalk); border:1.5px solid var(--panel-line); border-bottom-width:1.5px; border-radius:999px; }
  .chip.on { background:var(--yellow); color:var(--ink); border-color:var(--yellow-edge); }
  .set-note { text-align:center; color:var(--chalk-dim); line-height:1.6; }
  .set-note b { color:var(--yellow); font-family:var(--display); font-weight:400; }

  /* 제시어 타일 */
  .word { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:16px 0 4px; min-height:56px; }
  .tile {
    font-family:var(--display); font-size:1.9rem; width:48px; height:56px; display:grid; place-items:center;
    color:var(--ink); background:var(--paper); border-radius:10px; box-shadow:0 4px 0 #0004;
  }
  .gap { width:14px; }
  .tile.blank { background:#ffffff1c; box-shadow:none; border:2px dashed var(--panel-line); color:transparent; }
  .tile.win { background:var(--good); }
  .tile.me { background:var(--yellow); }
  .status { text-align:center; color:var(--chalk-dim); min-height:1.4em; margin-bottom:12px; font-size:.95rem; }
  .status.err { color:var(--bad); }

  /* 종이(캔버스) */
  .paper { position:relative; margin:6px 4px 0; padding:0; }
  .paper::before, .paper::after {
    content:""; position:absolute; top:-9px; width:64px; height:20px; background:#ffd16699; z-index:2; box-shadow:0 1px 0 #0002;
  }
  .paper::before { left:14px; transform:rotate(-6deg); } .paper::after { right:14px; transform:rotate(5deg); }
  canvas { display:block; width:100%; aspect-ratio:3/2; background:#fff; border-radius:6px; box-shadow:0 10px 24px #0006; touch-action:none; }

  /* 나무 도구함 */
  .tray {
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; margin-top:14px; padding:10px;
    background:var(--wood); border-bottom:5px solid var(--wood-edge); border-radius:16px;
  }
  .sw { width:30px; height:30px; padding:0; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 0 #0004; }
  .sw.on { transform:scale(1.25); box-shadow:0 0 0 3px var(--ink); }
  .tray button.tool { font-size:.9rem; padding:6px 12px; background:#f6e7cf; border-bottom-color:#cdb694; }
  .tray button.tool.on { background:var(--ink); color:var(--chalk); border-bottom-color:#000; }

  /* 채팅 */
  .chat { height:170px; overflow:auto; display:flex; flex-direction:column; gap:6px; padding-right:4px; }
  .bubble { align-self:flex-start; max-width:88%; padding:6px 12px; border-radius:14px 14px 14px 4px; background:#ffffff1c; word-break:break-all; }
  .bubble b { font-family:var(--display); font-weight:400; color:var(--c); margin-right:6px; }
  .bubble.ok { background:#7ee8c133; color:var(--good); font-family:var(--display); }
  .bubble.sys { align-self:center; background:none; color:var(--chalk-dim); font-size:.88rem; padding:0; }

  #overlay { position:fixed; inset:0; background:#0009; display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #overlay.show { display:flex; }
  #overlay .box { background:var(--board); border:2px dashed var(--panel-line); border-radius:24px; padding:24px 20px; text-align:center;
                  max-width:360px; width:100%; max-height:100%; overflow:auto; box-shadow:0 20px 50px #000a; }
  #overlay h2 { font-family:var(--display); font-weight:400; font-size:2rem; margin:0 0 6px; color:var(--yellow); }
  .rank { display:flex; flex-direction:column; gap:8px; margin:14px 0 18px; }
  .rank div { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-radius:14px; background:var(--c);
              color:var(--ink); font-family:var(--display); font-size:1.1rem; box-shadow:0 3px 0 #0003; }
  .rank div:first-child { transform:scale(1.04); }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  @media (max-width:420px) { .tile { width:40px; height:48px; font-size:1.6rem; } .logo { font-size:2.2rem; } }
</style>
</head>
<body>
<main>
  <div class="logo" aria-label="캐치마인드"><span>캐</span><span>치</span><span>마</span><span>인</span><span>드</span></div>
  <p class="sub">그리고, 맞히고, 웃고 — 친구들과 온라인으로</p>

  <!-- 로비 -->
  <section id="lobby" class="panel">
    <p class="lead">이름을 정하고 시작해요</p>
    <input class="t" id="myname" placeholder="내 이름" maxlength="8" aria-label="내 이름">
    <div class="line"><button class="big" id="create">방 만들기</button></div>
    <div class="sep">— 또는 친구가 알려준 코드로 —</div>
    <div class="line">
      <input class="t" id="joincode" placeholder="방 코드 4자리" maxlength="4" style="text-transform:uppercase" aria-label="방 코드">
      <button id="join">입장</button>
    </div>
    <div class="msg" id="lobbyMsg"></div>
  </section>

  <!-- 대기실 -->
  <section id="waiting" class="panel hidden">
    <p class="lead">친구들에게 이 코드를 알려주세요</p>
    <div class="code" id="roomCode"></div>
    <div class="tags" id="waitList"></div>
    <div id="settings"></div>
    <div class="line"><button class="big" id="start">게임 시작</button></div>
    <div class="msg" id="waitHint"></div>
  </section>

  <!-- 게임 -->
  <div id="game" class="hidden">
    <section class="panel">
      <div class="tags" id="plist"></div>
      <div class="word" id="word" aria-live="polite"></div>
      <div class="status" id="status"></div>
      <div class="paper"><canvas id="cv" width="600" height="400"></canvas></div>
      <div class="tray hidden" id="tray"></div>
    </section>
    <section class="panel">
      <div class="chat" id="chat" aria-live="polite"></div>
      <form id="form" class="line" autocomplete="off">
        <input class="t" id="guess" placeholder="정답 입력" maxlength="20" aria-label="정답 입력">
        <button id="send">전송</button>
      </form>
    </section>
    <div class="line" style="justify-content:center"><button class="soft hidden" id="skip">이 문제 넘기기</button></div>
  </div>
</main>

<div id="overlay"><div class="box">
  <h2>🏆 게임 끝!</h2>
  <div class="rank" id="rank"></div>
  <button class="big" id="again">한 판 더!</button>
  <div class="line"><button class="soft big" id="toLobby" style="font-size:1rem">설정 바꾸기</button></div>
  <div class="msg" id="againHint"></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const PREFIX = 'catchmind-kr-';
const COLORS = ['#ff8fab', '#ffd166', '#7ee8c1', '#6ec5ff', '#ffa45b', '#c9a7ff', '#b5e06a', '#f4a6e0'];
const PEN = ['#1d2b27', '#e0374f', '#f28c28', '#f2c94c', '#2e9d5b', '#2d7be0', '#8e44ad', '#ffffff'];
const MAX = 8, SCORES = [50, 40, 30, 20, 10], HINT_MS = 45000;
const L = t => t.split(',');
// e: 쉬움, m: 보통, h: 어려움
const BANK = {
  '음식':     { e: L('사과,바나나,수박,김밥,피자,라면,치킨,아이스크림,계란,딸기'),
                m: L('햄버거,떡볶이,핫도그,샌드위치,팝콘,만두,비빔밥,초밥,도넛'),
                h: L('삼겹살,탕후루,붕어빵,마카롱,호떡,김치찌개,카레,팥빙수,오므라이스,꿀떡') },
  '동물':     { e: L('강아지,고양이,토끼,물고기,오리,돼지,코끼리,기린,펭귄'),
                m: L('고래,상어,악어,하마,공작새,카멜레온,거북이,다람쥐,부엉이'),
                h: L('해파리,문어,달팽이,박쥐,낙타,캥거루,코알라,고슴도치,나무늘보,스컹크') },
  '탈것':     { e: L('자동차,기차,자전거,버스,배,비행기'),
                m: L('로켓,오토바이,헬리콥터,트럭,지하철,열기구,소방차'),
                h: L('잠수함,케이블카,스케이트보드,포클레인,구급차,유람선,인력거,견인차,킥보드') },
  '물건':     { e: L('안경,모자,신발,우산,가방,시계,의자,침대'),
                m: L('가위,열쇠,전화기,선풍기,칫솔,거울,냄비,텔레비전,냉장고'),
                h: L('리모컨,청소기,샹들리에,돋보기,자물쇠,체온계,나침반,저울,금고,망원경') },
  '자연·장소': { e: L('해,달,별,구름,나무,꽃,산,바다'),
                m: L('무지개,눈사람,번개,화산,폭포,사막,섬,우주선'),
                h: L('오로라,토네이도,동굴,등대,피라미드,빙하,일식,갯벌,오아시스,놀이공원') },
  '스포츠·놀이': { e: L('축구,야구,농구,수영,줄넘기'),
                m: L('볼링,골프,스키,태권도,권투,숨바꼭질,피아노'),
                h: L('펜싱,양궁,서핑,체조,컬링,씨름,윷놀이,탁구,술래잡기,장기') },
  '직업·사람': { e: L('의사,경찰,요리사,소방관,선생님'),
                m: L('마법사,해적,우주인,탐정,간호사,농부,왕,공주'),
                h: L('마술사,발레리나,사진작가,낚시꾼,심판,조련사,지휘자,광대,잠수부,미용사') },
  '상상·캐릭터': { e: L('유령,공룡,로봇,천사,눈사람'),
                m: L('용,인어,도깨비,좀비,외계인,마녀,유니콘'),
                h: L('드라큘라,구미호,해골,프랑켄슈타인,켄타우로스,요정,저승사자,인어공주') },
  '속담·관용구': { e: L('식은 죽 먹기,누워서 떡먹기,땅 짚고 헤엄치기,꿩 먹고 알 먹기,손이 크다'),
                m: L('우물 안 개구리,울며 겨자 먹기,귀에 걸면 귀걸이,발이 넓다,눈이 높다,입이 무겁다'),
                h: L('등잔 밑이 어둡다,소 잃고 외양간 고친다,누워서 침 뱉기,원숭이도 나무에서 떨어진다,고래 싸움에 새우 등 터진다,하늘의 별 따기,낮말은 새가 듣는다') },
};
const TOPICS = Object.keys(BANK);
const DIFFS = [['e', '쉬움'], ['m', '보통'], ['h', '어려움'], ['mix', '섞기']];

let peer, hostConn = null, conns = {}, isHost = false, myId = '';
let S = null;                                  // 모두가 보는 공유 상태
let H = { word: '', segs: [], queue: [], pool: [], started: 0, hinted: false };  // 방장만 아는 정보 (정답, 그림 기록)
let myWord = null;                             // {w, r}: 내가 그리는 사람일 때의 제시어
let colorSeq = 0, lastRound = -1, drawing = null;
let pen = { color: PEN[0], size: 8 };

const setStatus = (m, err) => { $('status').textContent = m; $('status').className = 'status' + (err ? ' err' : ''); };
function show(id) { for (const x of ['lobby', 'waiting', 'game']) $(x).classList.toggle('hidden', x !== id); }
const myName = () => $('myname').value.trim().slice(0, 8) || '플레이어';
const meIdx = () => S ? S.players.findIndex(p => p.id === myId) : -1;
const amDrawer = () => !!S && S.phase === 'play' && S.drawer === meIdx();

/* ---------- 그림판 ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
function clearCanvas() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }
function drawSeg(s) {
  ctx.strokeStyle = s[4]; ctx.lineWidth = s[5]; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(s[0] * cv.width, s[1] * cv.height); ctx.lineTo(s[2] * cv.width, s[3] * cv.height); ctx.stroke();
}
function pos(e) {
  const r = cv.getBoundingClientRect();
  return [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)];
}
cv.addEventListener('pointerdown', e => { if (!amDrawer()) return; cv.setPointerCapture(e.pointerId); drawing = pos(e); emitSeg([...drawing, ...drawing, pen.color, pen.size]); });
cv.addEventListener('pointermove', e => {
  if (!drawing || !amDrawer()) return;
  const p = pos(e); emitSeg([...drawing, ...p, pen.color, pen.size]); drawing = p;
});
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, () => drawing = null);

function emitSeg(seg) {
  drawSeg(seg);
  if (isHost) { H.segs.push(seg); broadcast({ t: 'draw', seg }); }
  else hostConn.send({ t: 'draw', seg });
}
function clearAll() {
  clearCanvas();
  if (isHost) { H.segs = []; broadcast({ t: 'clear' }); }
  else hostConn.send({ t: 'clear' });
}
function buildTray() {
  const t = $('tray'); t.replaceChildren();
  PEN.forEach(c => {
    const b = document.createElement('button'); b.className = 'sw' + (pen.color === c ? ' on' : ''); b.style.background = c;
    b.setAttribute('aria-label', c === '#ffffff' ? '지우개' : '색 ' + c);
    b.onclick = () => { pen.color = c; buildTray(); }; t.appendChild(b);
  });
  [[3, '얇게'], [8, '보통'], [18, '굵게']].forEach(([s, n]) => {
    const b = document.createElement('button'); b.className = 'tool' + (pen.size === s ? ' on' : ''); b.textContent = n;
    b.onclick = () => { pen.size = s; buildTray(); }; t.appendChild(b);
  });
  const c = document.createElement('button'); c.className = 'tool'; c.textContent = '싹 지우기'; c.onclick = clearAll; t.appendChild(c);
}

/* ---------- 연결 ---------- */
function makeCode() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 4 }, () => c[Math.floor(Math.random() * c.length)]).join('');
}
const broadcast = (m, except) => { for (const [id, c] of Object.entries(conns)) if (c.open && id !== except) c.send(m); };
const lobbyMsg = (m, err) => { $('lobbyMsg').textContent = m; $('lobbyMsg').className = 'msg' + (err ? ' err' : ''); };

$('create').onclick = () => {
  isHost = true; myId = 'host';
  const code = makeCode();
  lobbyMsg('방 만드는 중…');
  peer = new Peer(PREFIX + code);
  peer.on('error', e => {
    if (e.type === 'unavailable-id') return $('create').click();
    lobbyMsg('연결 오류: ' + e.type, true);
  });
  peer.on('open', () => {
    $('roomCode').replaceChildren(...Array.from(code).map(ch => { const b = document.createElement('b'); b.textContent = ch; return b; }));
    S = { phase: 'lobby', players: [newPlayer('host', myName())], drawer: -1, roundNo: 0, hint: '', answer: '', note: '', chat: [], solvedN: 0, total: 0, cat: '',
          settings: { topics: [...TOPICS], diff: 'mix', rounds: 2 } };
    setInterval(hostTick, 500);
    publish();
  });
  peer.on('connection', c => {
    c.on('data', m => onGuestMsg(c, m));
    c.on('close', () => removePlayer(c.peer));
  });
};

$('join').onclick = () => {
  const code = $('joincode').value.trim().toUpperCase();
  if (code.length !== 4) return lobbyMsg('코드 4자리를 입력하세요', true);
  isHost = false;
  lobbyMsg('입장 중…');
  peer = new Peer();
  peer.on('error', e => lobbyMsg(e.type === 'peer-unavailable' ? '해당 방을 찾을 수 없어요' : '연결 오류: ' + e.type, true));
  peer.on('open', id => {
    myId = id;
    hostConn = peer.connect(PREFIX + code, { reliable: true });
    hostConn.on('open', () => hostConn.send({ t: 'hello', name: myName() }));
    hostConn.on('data', onHostMsg);
    hostConn.on('close', () => {
      if (!S) return lobbyMsg('연결에 실패했어요', true);
      $('send').disabled = true; $('skip').classList.add('hidden');
      setStatus('방장이 나가서 게임이 끝났어요', true);
    });
  });
};

function onHostMsg(m) {
  if (m.t === 'state') apply(m.s);
  else if (m.t === 'word') { myWord = { w: m.w, r: m.r }; if (S) render(); }
  else if (m.t === 'draw') drawSeg(m.seg);
  else if (m.t === 'clear') clearCanvas();
  else if (m.t === 'canvas') m.segs.forEach(drawSeg);
  else if (m.t === 'full') { lobbyMsg(m.msg, true); show('lobby'); }
}

/* ---------- 방장: 게임 로직 ---------- */
function newPlayer(id, name) {
  return { id, name: String(name || '플레이어').slice(0, 8), color: COLORS[colorSeq++ % COLORS.length], score: 0, solved: false, left: false };
}
function publish() { broadcast({ t: 'state', s: S }); apply(S); }
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const say = m => { S.chat.push(m); if (S.chat.length > 40) S.chat.shift(); };
const guessers = () => S.players.filter((p, i) => i !== S.drawer && !p.left);

function onGuestMsg(c, m) {
  const idx = S.players.findIndex(p => p.id === c.peer);
  if (m.t === 'hello') {
    if (S.players.length >= MAX) return reject(c, '방이 가득 찼어요 (최대 8명)');
    if (idx >= 0) return;
    conns[c.peer] = c;
    const p = newPlayer(c.peer, m.name);
    S.players.push(p);
    if (S.phase === 'play') say({ sys: true, t: `${p.name} 님이 들어왔어요` });
    publish();
    if (H.segs.length) c.send({ t: 'canvas', segs: H.segs });
    return;
  }
  if (idx < 0) return;
  const isD = S.phase === 'play' && idx === S.drawer;
  if (m.t === 'draw' && isD && Array.isArray(m.seg) && m.seg.length === 6) {
    H.segs.push(m.seg); drawSeg(m.seg); broadcast({ t: 'draw', seg: m.seg }, c.peer);
  } else if (m.t === 'clear' && isD) {
    H.segs = []; clearCanvas(); broadcast({ t: 'clear' }, c.peer);
  } else if (m.t === 'guess') guess(idx, m.w);
  else if (m.t === 'skip' && isD) endRound('그린 사람이 넘겼어요');
}
function reject(c, msg) { c.send({ t: 'full', msg }); setTimeout(() => c.close(), 300); }

function removePlayer(id) {
  delete conns[id];
  if (!S) return;
  const idx = S.players.findIndex(p => p.id === id);
  if (idx < 0) return;
  if (S.phase === 'lobby' || S.phase === 'over') { S.players.splice(idx, 1); return publish(); }
  S.players[idx].left = true;
  if (S.players.filter(p => !p.left).length < 2) return finishGame();
  if (S.phase === 'play' && idx === S.drawer) return endRound('그리는 사람이 나갔어요');
  if (S.phase === 'play' && guessers().every(p => p.solved)) return endRound('모두 맞혔어요!');
  publish();
}

function startGame() {
  S.players = S.players.filter(p => !p.left);
  if (S.players.length < 2) return;
  S.players.forEach(p => { p.score = 0; p.solved = false; });
  S.chat = [];
  H.queue = [];
  for (let r = 0; r < S.settings.rounds; r++) {           // 한 사람당 N번씩, 라운드마다 순서를 섞음
    let order = shuffle(S.players.map(p => p.id));
    if (H.queue.length && order[0] === H.queue[H.queue.length - 1]) order.push(order.shift());
    H.queue.push(...order);
  }
  S.total = H.queue.length; S.roundNo = 0; H.used = new Set();
  nextRound();
}
const hintFor = (w, first) => Array.from(w).map((c, i) => c === ' ' ? ' ' : first && i === 0 ? c : '_').join('');
function pickWord() {
  const st = S.settings, all = [], wide = [];
  for (const t of st.topics) for (const lv of ['e', 'm', 'h']) for (const w of BANK[t][lv]) {
    const x = { w, cat: t }; wide.push(x); if (st.diff === 'mix' || st.diff === lv) all.push(x);
  }
  const fresh = x => !H.used.has(x.w);
  let pool = all.filter(fresh);
  if (!pool.length) pool = wide.filter(fresh);       // 고른 난이도 단어가 떨어지면 다른 난이도로 채움
  if (!pool.length) { H.used.clear(); pool = all; }
  const x = pool[Math.floor(Math.random() * pool.length)];
  H.used.add(x.w); return x;
}
function nextRound() {
  let idx = -1;
  while (H.queue.length && idx < 0) { const id = H.queue.shift(); idx = S.players.findIndex(p => p.id === id && !p.left); }
  if (idx < 0) return finishGame();
  S.phase = 'play'; S.drawer = idx; S.roundNo++; S.solvedN = 0;
  S.players.forEach(p => p.solved = false);
  const pick = pickWord();
  H.word = pick.w; S.cat = pick.cat; H.segs = []; H.started = Date.now(); H.hinted = false;
  S.hint = hintFor(H.word, false); S.answer = ''; S.note = '';
  say({ sys: true, t: `✏️ ${S.players[idx].name} 님이 그립니다 · ${pick.cat} · ${H.word.replace(/ /g, '').length}글자` });
  clearCanvas(); broadcast({ t: 'clear' });
  const d = S.players[idx].id;
  if (d === 'host') myWord = { w: H.word, r: S.roundNo };
  else if (conns[d]) conns[d].send({ t: 'word', w: H.word, r: S.roundNo });
  publish();
}
function guess(idx, text) {
  text = String(text || '').trim().slice(0, 20);
  if (!text || S.phase !== 'play' || idx === S.drawer || S.players[idx].solved) return;
  const p = S.players[idx];
  if (text.replace(/\s+/g, '') === H.word.replace(/\s+/g, '')) {
    const pts = SCORES[Math.min(S.solvedN, SCORES.length - 1)];
    S.solvedN++; p.solved = true; p.score += pts; S.players[S.drawer].score += 10;
    say({ ok: true, n: p.name, c: p.color, t: `${p.name} 정답! +${pts}점` });
    if (guessers().every(g => g.solved)) return endRound('모두 맞혔어요!');
  } else say({ n: p.name, c: p.color, t: text });
  publish();
}
function endRound(note) {
  S.phase = 'reveal'; S.answer = H.word; S.note = note;
  say({ sys: true, t: `정답은 「${H.word}」` });
  publish();
  setTimeout(() => { if (S.phase === 'reveal') nextRound(); }, 4000);
}
function finishGame() { S.phase = 'over'; publish(); }
function hostTick() {
  // 시간제한은 없고, 오래 걸리면 첫 글자 힌트만 열어 줌
  if (!S || S.phase !== 'play' || H.hinted || H.word.length < 2) return;
  if (Date.now() - H.started > HINT_MS) {
    H.hinted = true; S.hint = hintFor(H.word, true); publish();
  }
}

$('start').onclick = () => { if (isHost) startGame(); };
$('again').onclick = () => { if (isHost) startGame(); };
$('toLobby').onclick = () => { if (isHost) { S.phase = 'lobby'; S.players = S.players.filter(p => !p.left); publish(); } };
$('skip').onclick = () => { if (!S || S.phase !== 'play') return; if (isHost) endRound(amDrawer() ? '그린 사람이 넘겼어요' : '방장이 넘겼어요'); else hostConn.send({ t: 'skip' }); };

/* ---------- 화면 ---------- */
function renderTags(el, list, drawer, showScore = true) {
  el.replaceChildren();
  list.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'tag' + (drawer === i ? ' drawer' : '') + (p.left ? ' gone' : '');
    d.style.setProperty('--c', p.color);
    const nm = document.createElement('div'); nm.className = 'nm';
    nm.textContent = (drawer === i ? '✏️ ' : p.solved ? '✔ ' : '') + p.name + (p.id === myId ? ' (나)' : '');
    d.appendChild(nm);
    if (showScore) {
      const sc = document.createElement('div'); sc.className = 'sc'; sc.textContent = p.score;
      const u = document.createElement('small'); u.textContent = '점'; sc.appendChild(u); d.appendChild(sc);
    }
    el.appendChild(d);
  });
}
function renderSettings() {
  const st = S.settings, el = $('settings'); el.replaceChildren();
  const dn = DIFFS.find(d => d[0] === st.diff)[1];
  if (!isHost) {
    const d = document.createElement('div'); d.className = 'set-note';
    const b = t => { const x = document.createElement('b'); x.textContent = t; return x; };
    d.append('주제 ', b(st.topics.length === TOPICS.length ? '전체' : st.topics.join(', ')), ' · 난이도 ', b(dn),
             ' · 한 사람당 ', b(st.rounds + '번'), ' 그리기');
    return el.appendChild(d);
  }
  const row = label => { const r = document.createElement('div'); r.className = 'set-row'; const l = document.createElement('span'); l.textContent = label; r.appendChild(l); el.appendChild(r); return r; };
  const chip = (r, text, on, fn) => { const b = document.createElement('button'); b.className = 'chip' + (on ? ' on' : ''); b.textContent = text; b.onclick = fn; r.appendChild(b); };
  const t = row('주제 (여러 개 고르면 섞여서 나와요)');
  chip(t, '전체', st.topics.length === TOPICS.length, () => { st.topics = [...TOPICS]; publish(); });
  TOPICS.forEach(n => chip(t, n, st.topics.length !== TOPICS.length && st.topics.includes(n), () => {
    const all = st.topics.length === TOPICS.length;
    const cur = all ? [] : st.topics;
    const next = cur.includes(n) ? cur.filter(x => x !== n) : [...cur, n];
    st.topics = next.length ? next : [...TOPICS]; publish();
  }));
  const d = row('난이도');
  DIFFS.forEach(([k, n]) => chip(d, n, st.diff === k, () => { st.diff = k; publish(); }));
  const r = row('한 사람당 그리는 횟수');
  [1, 2, 3, 5].forEach(n => chip(r, n + '번', st.rounds === n, () => { st.rounds = n; publish(); }));
  const total = document.createElement('div'); total.className = 'set-note';
  total.textContent = `${S.players.length}명이면 총 ${S.players.length * st.rounds}문제`; el.appendChild(total);
}
function tiles(chars, cls) {
  const w = $('word'); w.replaceChildren();
  Array.from(chars).forEach(ch => {
    if (ch === ' ') { const g = document.createElement('div'); g.className = 'gap'; return w.appendChild(g); }
    const t = document.createElement('div');
    t.className = 'tile' + (ch === '_' ? ' blank' : '') + (cls ? ' ' + cls : '');
    t.textContent = ch === '_' ? '·' : ch; w.appendChild(t);
  });
}

function apply(s) {
  S = s;
  if (s.phase === 'lobby') {
    show('waiting'); $('overlay').classList.remove('show');
    renderTags($('waitList'), s.players, -1, false);
    renderSettings();
    $('start').classList.toggle('hidden', !isHost);
    $('start').disabled = s.players.length < 2;
    $('waitHint').textContent = isHost
      ? (s.players.length < 2 ? '친구가 들어오면 시작할 수 있어요' : `${s.players.length}명 입장! 시작하세요`)
      : '방장이 시작하길 기다리는 중…';
    return;
  }
  show('game');
  if (s.roundNo !== lastRound) { lastRound = s.roundNo; clearCanvas(); drawing = null; }
  render();
}

function render() {
  const s = S, me = meIdx();
  renderTags($('plist'), s.players, s.phase === 'play' || s.phase === 'reveal' ? s.drawer : -1);
  const drawer = amDrawer();
  $('tray').classList.toggle('hidden', !drawer);
  if (drawer) buildTray();
  cv.style.cursor = drawer ? 'crosshair' : 'default';
  $('skip').classList.toggle('hidden', !(s.phase === 'play' && (drawer || isHost)));

  const chat = $('chat'); chat.replaceChildren();
  for (const m of s.chat) {
    const d = document.createElement('div');
    if (m.sys) { d.className = 'bubble sys'; d.textContent = m.t; }
    else if (m.ok) { d.className = 'bubble ok'; d.textContent = m.t; }
    else {
      d.className = 'bubble'; d.style.setProperty('--c', m.c);
      const b = document.createElement('b'); b.textContent = m.n;
      d.append(b, document.createTextNode(m.t));
    }
    chat.appendChild(d);
  }
  chat.scrollTop = 1e6;

  const mine = me >= 0 ? s.players[me] : null;
  const canGuess = s.phase === 'play' && !drawer && !!mine && !mine.solved;
  $('guess').disabled = !canGuess; $('send').disabled = !canGuess;
  $('guess').placeholder = drawer ? '그림으로 설명하세요!' : mine && mine.solved ? '정답! 다른 사람을 기다려요 👏' : '정답 입력';

  if (s.phase === 'reveal') { tiles(s.answer, 'win'); setStatus(`${s.note} · ${s.roundNo}/${s.total}번째 문제`); }
  else if (s.phase === 'play') {
    if (drawer && myWord && myWord.r === s.roundNo) { tiles(myWord.w, 'me'); setStatus(`[${s.cat}] 이 단어를 그림으로! · ${s.roundNo}/${s.total} (글자 쓰기 금지)`); }
    else { tiles(s.hint); setStatus(`[${s.cat}] ${s.players[s.drawer].name} 님이 그리는 중 · ${s.roundNo}/${s.total}`); }
  } else { $('word').replaceChildren(); setStatus(''); }

  $('overlay').classList.toggle('show', s.phase === 'over');
  if (s.phase === 'over') {
    const rk = $('rank'); rk.replaceChildren();
    [...s.players].sort((a, b) => b.score - a.score).forEach((p, i) => {
      const d = document.createElement('div'); d.style.setProperty('--c', p.color);
      const a = document.createElement('span'); a.textContent = `${['🥇', '🥈', '🥉'][i] || (i + 1) + '위'} ${p.name}${p.id === myId ? ' (나)' : ''}`;
      const b = document.createElement('span'); b.textContent = p.score + '점';
      d.append(a, b); rk.appendChild(d);
    });
    $('again').classList.toggle('hidden', !isHost); $('toLobby').parentElement.classList.toggle('hidden', !isHost);
    $('againHint').textContent = isHost ? '' : '방장이 다시 시작하길 기다리는 중…';
  }
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const w = $('guess').value.trim();
  if (!w) return;
  $('guess').value = '';
  if (isHost) guess(meIdx(), w); else hostConn.send({ t: 'guess', w });
});
</script>
</body>
</html>
